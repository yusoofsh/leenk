name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to deploy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nub and Node.js
        uses: nubjs/setup-nub@v0
        with:
          node-version: 26.5.0

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Verify project
        run: nub run verify

      - name: Audit dependencies
        run: nub audit --audit-level=high

  deploy:
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.stage == 'prod' && 'production' || 'development' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Nub and Node.js
        uses: nubjs/setup-nub@v0
        with:
          node-version: 26.5.0

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Deploy stack
        run: nub exec alchemy deploy --stage ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATIC_UPLOAD_TOKEN: ${{ secrets.STATIC_UPLOAD_TOKEN }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
